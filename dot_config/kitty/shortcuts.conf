# shortcuts.conf -- tmux-ish prefix bindings for kitty
#
# Install:
#   1. Put this file next to your kitty.conf, or anywhere you like.
#   2. Add this line to kitty.conf:
#        include shortcuts.conf
#   3. Create the session directory used below:
#        mkdir -p ~/.local/share/kitty/sessions
#   4. Reload kitty config.
#
# Prefix convention used here:
#   <prefix>    = Ctrl+k
#   <prefix> x  = Ctrl+k, then x
#   <prefix> C-x = Ctrl+k, then Ctrl+x
#
# Notes:
# - tmux panes  ~= kitty windows inside a tab
# - tmux windows ~= kitty tabs
# - tmux sessions ~= kitty sessions saved/loaded from ~/.local/share/kitty/sessions

# Make Ctrl+k chorded mappings feel tmux-like.
map_timeout 1.5

# Required for explicit pane-style splitting.
# hsplit = one pane above/below the other; vsplit = side-by-side.
enabled_layouts splits:split_axis=horizontal,stack,tall,fat,grid,horizontal,vertical

# Copy-mode pager. This uses Neovim as a vi-ish scrollback/copy mode.
# In this mode:
#   v      starts visual selection
#   Ctrl+v starts blockwise visual selection
#   H      jumps to start of line
#   L      jumps to end of line
#   y      copies selection to the system clipboard
#   Escape cancels the current visual operation
#   q      exits copy-mode
scrollback_pager nvim --cmd 'set eventignore=FileType' +'set clipboard+=unnamedplus' +'nnoremap q ZQ' +'nnoremap H ^' +'nnoremap L $' +'xnoremap H ^' +'xnoremap L $' +'xnoremap y "+y' +'call nvim_open_term(0, {})' +'set nomodified nolist nonumber norelativenumber' +'$' -

# -----------------------------------------------------------------------------
# Global
# -----------------------------------------------------------------------------

# C-l clears both the visible screen and kitty scrollback/history.
map ctrl+l combine : clear_terminal clear active : clear_terminal scrollback active

# -----------------------------------------------------------------------------
# Sessions
# -----------------------------------------------------------------------------

# <prefix> C-c creates/saves a named session file.
# You will be prompted for a session name/path under ~/.local/share/kitty/sessions.
map ctrl+k>ctrl+c save_as_session --use-foreground-process --base-dir ~/.local/share/kitty/sessions

# <prefix> C-f switches to another saved session by name.
# Pick from files under ~/.local/share/kitty/sessions.
map ctrl+k>ctrl+f goto_session ~/.local/share/kitty/sessions

# Keep tmux's default <prefix> n intentionally unbound.
map ctrl+k>n discard_event

# -----------------------------------------------------------------------------
# Windows: tmux windows ~= kitty tabs
# -----------------------------------------------------------------------------

# <prefix> C-h / C-l navigate tabs/windows.
map ctrl+k>ctrl+h previous_tab
map ctrl+k>ctrl+l next_tab

# <prefix> c creates a new tab/window.
map ctrl+k>c new_tab_with_cwd

map ctrl+k>t new_tab



# <prefix> Tab goes to the last active tab/window.
map ctrl+k>tab goto_tab -1

# <prefix> 1..9 jumps to the numbered tab/window.
# Kitty tab numbers start at 1; numbers larger than the tab count go to the last tab.
map ctrl+k>1 goto_tab 1
map ctrl+k>2 goto_tab 2
map ctrl+k>3 goto_tab 3
map ctrl+k>4 goto_tab 4
map ctrl+k>5 goto_tab 5
map ctrl+k>6 goto_tab 6
map ctrl+k>7 goto_tab 7
map ctrl+k>8 goto_tab 8
map ctrl+k>9 goto_tab 9

# -----------------------------------------------------------------------------
# Panes: tmux panes ~= kitty windows inside a tab
# -----------------------------------------------------------------------------

# <prefix> - splits vertically in tmux terms: top/bottom panes.
map ctrl+k>minus combine : goto_layout splits : launch --cwd=current --location=hsplit

# <prefix> _ splits horizontally in tmux terms: side-by-side panes.
map ctrl+k>shift+minus combine : goto_layout splits : launch --cwd=current --location=vsplit

# <prefix> h/j/k/l navigates panes like Vim.
map ctrl+k>h neighboring_window left
map ctrl+k>j neighboring_window down
map ctrl+k>k neighboring_window up
map ctrl+k>l neighboring_window right

# <prefix> H/J/K/L resizes panes.
map ctrl+k>shift+h resize_window narrower 5
map ctrl+k>shift+j resize_window shorter 5
map ctrl+k>shift+k resize_window taller 5
map ctrl+k>shift+l resize_window wider 5

# <prefix> < and > swap/reorder panes.
map ctrl+k>shift+, move_window_backward
map ctrl+k>shift+. move_window_forward

# <prefix> + moves the current pane into a new kitty tab/window.
# This is closer to tmux's "break pane into a window" than reversible zoom.
map ctrl+k>shift+equal detach_window new-tab

# If you prefer reversible zoom/maximize instead, comment the line above and use:
# map ctrl+k>shift+equal toggle_layout stack

# -----------------------------------------------------------------------------
# Mouse mode
# -----------------------------------------------------------------------------

# There is no tmux-style global mouse-mode toggle in pure kitty config.
# Kitty's mouse handling is mostly automatic. When a terminal app captures the
# mouse, use Shift+drag/click for terminal selection behavior.
# <prefix> m is deliberately swallowed so it does not leak into the shell/app.
map ctrl+k>m discard_event

# -----------------------------------------------------------------------------
# Copy mode / paste buffers
# -----------------------------------------------------------------------------

# <prefix> Enter enters copy-mode / scrollback pager.
map ctrl+k>enter show_scrollback

# <prefix> p pastes from the effective top paste-buffer.
# This setup treats the system clipboard as the top paste-buffer because the
# Neovim copy-mode above yanks selections into the system clipboard.
map ctrl+k>p paste_from_clipboard

# tmux has a dynamic paste-buffer list and chooser. Kitty supports named private
# buffers, but it does not provide a built-in tmux-like list/choose UI in config.
# These keys are swallowed so they do not leak into the shell/app.
map ctrl+k>b discard_event
map ctrl+k>shift+p discard_event

# Optional alternative: make mouse selections copy into a named kitty buffer
# called "tmux", and paste from it. This does not integrate with the Neovim
# copy-mode above, so it is disabled by default.
# copy_on_select tmux
# map ctrl+k>p paste_from_buffer tmux
